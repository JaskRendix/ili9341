[package]
name = "ili9341-driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

description = "A platform-agnostic Rust driver for ILI9341 and ILI9340C TFT LCD displays"
authors = ["Giorgio"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
display-interface = "0.5"
embedded-hal = "1.0"

[dependencies.embedded-graphics-core]
version = "0.4"
optional = true

[features]
default = ["graphics"]
graphics = ["dep:embedded-graphics-core"]

# Common dependencies used by the examples
[dev-dependencies]
display-interface-spi = "0.5"
embedded-graphics = "0.8.1"
embedded-hal-bus = "0.3"

# RP2040/Pico-only dependencies
[target.'cfg(target_arch = "arm")'.dev-dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
cortex-m-rtic = "1.1.4"
defmt = "1"
defmt-rtt = "1"
panic-semihosting = "0.6"
rp-pico = "0.9"

# ESP32-C6-only dependencies
[target.'cfg(target_arch = "riscv32")'.dev-dependencies]
esp-hal = { version = "0.23.0", features = ["esp32c6"] }
esp-alloc = "0.6.0"
panic-halt = "1.0"

[[example]]
name = "rtic"
test = false

[[example]]
name = "esp32c6"
path = "examples/esp32c6/main.rs"
test = false

[[example]]
name = "rppico"
path = "examples/rppico/main.rs"
test = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
