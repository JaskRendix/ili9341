[package]
name = "ili9341-driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

description = "A platform-agnostic Rust driver for ILI9341 and ILI9340C TFT LCD displays"
authors = ["Giorgio"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
display-interface = "0.5"
embedded-hal = "1.0"

[dependencies.embedded-graphics-core]
version = "0.4"
optional = true

[features]
default = ["graphics"]
graphics = ["dep:embedded-graphics-core"]

[dev-dependencies]
display-interface-spi = "0.5"
embedded-graphics = "0.8.1"
embedded-hal-bus = "0.3"

[target.thumbv7em-none-eabihf.dev-dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
cortex-m-rtic = "1.1.4"
stm32f4xx-hal = { version = "0.23", features = ["stm32f411"] }
panic-halt = "1.0"

[target.thumbv6m-none-eabi.dev-dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
rp-pico = "0.9"
defmt = "1"
defmt-rtt = "1"
panic-halt = "1.0"
panic-semihosting = "0.7"

[target.riscv32imac-unknown-none-elf.dev-dependencies]
esp-hal = { version = "0.23.0", features = ["esp32c6"] }
esp-alloc = "0.7.0"
panic-halt = "1.0"

[[example]]
name = "rtic"
path = "examples/rtic/main.rs"
test = false

[[example]]
name = "esp32c6"
path = "examples/esp32c6/main.rs"
test = false

[[example]]
name = "rppico"
path = "examples/rppico/main.rs"
test = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
